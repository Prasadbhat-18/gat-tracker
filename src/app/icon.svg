<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002147" />
      <stop offset="100%" stop-color="#0058be" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Shield / Base -->
  <rect width="100" height="100" rx="24" fill="url(#gatGrad)" />
  
  <!-- Outer Gold Accent Ring -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Institutional Academic Cap / Emblem -->
  <!-- Cap Diamond -->
  <polygon points="50,22 80,34 50,46 20,34" fill="url(#goldGrad)" />
  
  <!-- Cap Skull Base -->
  <path d="M32,41 L32,54 C32,63 68,63 68,54 L68,41 Z" fill="#ffffff" fill-opacity="0.9" />
  
  <!-- Tassel -->
  <path d="M74,36 L78,48 L76,56 L72,56 L74,48 Z" fill="#fbbf24" />
  <circle cx="75" cy="58" r="2.5" fill="#f59e0b" />

  <!-- Bold Letter "G" -->
  <text x="50" y="86" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="-1">G</text>
</svg>
